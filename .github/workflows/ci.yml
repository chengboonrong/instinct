name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and create diagnostic lockfile
        run: npm install
      - name: Report dependency advisories
        run: node scripts/report-audit.mjs
      - name: Preserve exact dependency resolution for review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            package-lock.json
            audit-report.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bootstrap audited lockfile on stabilization branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/release-security-hardening'
        run: |
          npm audit --audit-level=moderate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: commit verified npm workspace lockfile'
            git push origin HEAD:chore/release-security-hardening
          fi
