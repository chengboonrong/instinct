name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency advisories
        run: node scripts/report-audit.mjs
      - name: Preserve dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            package-lock.json
            audit-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce zero moderate-or-higher vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build standalone mobile device benchmark site
        run: npm run build:mobile --workspace=@instinct/example-remote
      - name: Preserve static device benchmark site
        uses: actions/upload-artifact@v4
        with:
          name: mobile-benchmark-site
          path: examples/three-remote/dist-mobile/
          if-no-files-found: error
          retention-days: 14
      - name: Benchmark synthetic AI scheduler load (non-gating)
        run: node scripts/benchmark-ai.mjs > ai-benchmark.json
      - name: Preserve AI benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-performance-baseline
          path: ai-benchmark.json
          retention-days: 7
  browser:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build workspace packages for local bridge and Vite
        run: npm run build
      - name: Run real browser acceptance
        run: npm run test:e2e
      - name: Preserve browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
