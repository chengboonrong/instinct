name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and create diagnostic lockfile
        run: npm install
      - name: Report dependency advisories
        run: node scripts/report-audit.mjs
      - name: Preserve exact dependency resolution for review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            package-lock.json
            audit-report.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
