name: CI
on:
  push:
  pull_request:
permissions:
  contents: write # TEMPORARY: bootstrap Playwright lockfile on this draft branch only
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh dependency resolution for Playwright
        run: npm install
      - name: Enforce zero moderate-or-higher advisories
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified lockfile (temporary bootstrap)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test/playwright-browser-acceptance'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(test): lock Playwright browser test dependencies'
            git push origin HEAD:test/playwright-browser-acceptance
          fi
