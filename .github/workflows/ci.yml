name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency advisories
        run: node scripts/report-audit.mjs
      - name: Preserve dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            package-lock.json
            audit-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce zero moderate-or-higher vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Benchmark synthetic AI scheduler load (non-gating)
        run: node scripts/benchmark-ai.mjs > ai-benchmark.json
      - name: Preserve AI benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-performance-baseline
          path: ai-benchmark.json
          retention-days: 7
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build workspace packages for local bridge and Vite
        run: npm run build
      - name: Install Chromium and WebKit browser engines
        run: npx playwright install --with-deps --only-shell chromium webkit
      - name: Run real browser acceptance
        run: npm run test:e2e
      - name: Preserve browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
